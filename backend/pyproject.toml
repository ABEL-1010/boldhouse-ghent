[project]
name = "sentinel"
dynamic = ["version"]
description = "Flight recorder and anomaly detector for AI agents"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sentinel-reset = "sentinel.features.tools.reset:main"
sentinel-agent = "agent.cli:main"
sentinel-traces = "ml.generate_traces:main"
sentinel-train = "ml.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel", "src/agent", "src/ml", "src/fakeweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets each feature have test files with the same basename.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
